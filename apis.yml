name: BIZZON
description: >-
  BIZZON (formerly AgentCASH) was a London-based hospitality and restaurant
  technology company founded in 2015, offering an end-to-end point-of-sale (POS)
  and payments platform for the food-and-beverage and hospitality sector. Its
  suite spanned sales/ordering tools, business intelligence, and fully certified
  cloud-hosted omnichannel payment technology, letting operators manage online
  orders, payments, menus, inventory, staff, and loyalty. Backed by Techstars,
  Mews, and Ascension, BIZZON was acquired by hospitality cloud platform Mews in
  March 2022 and its product and infrastructure have since been folded into Mews;
  the former developer surface (developers.bizzon.com), status page, and the
  agentcash.com domain are no longer live, and the your.bizzon.com portal now
  redirects to pos.mews.com. This profile is retained as a historical
  provider/company record. No independent live API or developer surface remains
  to enrich.
